<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 574" width="862" height="574" role="img" aria-labelledby="title">
  <title id="title">Offline reliability evaluation</title>
  <rect width="862" height="574" rx="12" fill="#0f172a"/>
  <rect width="862" height="44" rx="12" fill="#1e293b"/>
  <text x="22" y="28" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">Offline reliability evaluation</text>
  <g font-family="monospace" font-size="15" xml:space="preserve">
    <text x="22" y="70" fill="#86efac">$ python3 -m src.main evaluate</text>
    <text x="22" y="91" fill="#e2e8f0"></text>
