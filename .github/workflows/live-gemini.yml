name: Live Gemini grounding tests

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  live-gemini:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.label.name == 'run-live-gemini' ||
      github.event.label.name == 'run-live-gemini-followup' ||
      github.event.label.name == 'run-judge-comparison') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/gemini-grounding-judge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run live Gemini tests
        if: github.event.label.name != 'run-judge-comparison'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_LIVE_GEMINI_TESTS: '1'
          LIVE_GEMINI_MODE: ${{ github.event.label.name }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Configure the GEMINI_API_KEY repository secret first."
            exit 1
          fi
          if [ "$LIVE_GEMINI_MODE" = "run-live-gemini-followup" ]; then
            python -m pytest -q -s -rs tests/test_llm_explainer.py \
              -k 'live_gemini and replays_original_candidates'
            exit 0
          fi

          replay_status=0
          python -m pytest -q -s -rs tests/test_llm_explainer.py \
            -k 'live_gemini and not generation_and_review' || replay_status=$?

          # The replay and fresh batches fit separately in the free-tier window.
          sleep 61
          python -m pytest -q -s -rs tests/test_llm_explainer.py \
            -k 'live_gemini and generation_and_review'
          exit "$replay_status"
      - name: Compare Gemini, Claude, and Groq on saved candidates
        if: github.event.label.name == 'run-judge-comparison'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_LIVE_GEMINI_TESTS: '1'
          RUN_LIVE_JUDGE_COMPARISON: '1'
        run: |
          for key in GEMINI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              exit 1
            fi
          done
          python -m pytest -q -s -rs tests/test_llm_explainer.py -k live_judge_comparison
